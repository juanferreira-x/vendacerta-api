# =============================================================================
# Mensagens exibidas ao usuario (pt-BR).
# O codigo referencia apenas as chaves; o texto fica aqui. Para um novo idioma,
# crie messages_<locale>.properties (ex: messages_en.properties) com as mesmas chaves.
# Argumentos {0}, {1}... seguem java.text.MessageFormat ({0,number,#} evita "1.000" em IDs).
# =============================================================================

# --- Titulos dos erros de dominio ---
error.resource-not-found.title=Recurso não encontrado
error.insufficient-stock.title=Estoque insuficiente

# --- Detalhes dos erros de dominio ---
product.not-found=Produto não encontrado com o ID: {0,number,#}.
sale.insufficient-stock=Estoque insuficiente para o produto: {0} | Disponível: {1} | Solicitado: {2}

# --- Validacao de campos (Bean Validation) ---
product.name.not-blank=O nome do produto não pode ser vazio.
product.price.not-null=O preço é obrigatório.
product.price.positive-or-zero=O preço não pode ser negativo.
product.stock-quantity.not-null=A quantidade em estoque é obrigatória.
product.stock-quantity.positive-or-zero=A quantidade em estoque não pode ser negativa.
sale.items.not-empty=A venda deve ter pelo menos um item.
sale.item.product-id.not-null=O ID do produto é obrigatório.
sale.item.quantity.not-null=A quantidade é obrigatória.
sale.item.quantity.positive=A quantidade deve ser maior que zero.

