problemDetail.org.springframework.web.bind.MethodArgumentNotValidException=Um ou mais campos estão inválidos.
problemDetail.title.org.springframework.http.converter.HttpMessageNotReadableException=Requisição inválida
problemDetail.org.springframework.http.converter.HttpMessageNotReadableException=O corpo da requisição está malformado ou ilegível.
problemDetail.title.org.springframework.web.HttpRequestMethodNotSupportedException=Método não permitido
problemDetail.org.springframework.web.HttpRequestMethodNotSupportedException=Este método HTTP não é suportado por este endpoint.
problemDetail.title.org.springframework.web.HttpMediaTypeNotSupportedException=Tipo de conteúdo não suportado
problemDetail.org.springframework.web.HttpMediaTypeNotSupportedException=Envie o corpo da requisição como application/json.
problemDetail.title.org.springframework.web.servlet.resource.NoResourceFoundException=Recurso não encontrado
problemDetail.org.springframework.web.servlet.resource.NoResourceFoundException=O endpoint solicitado não existe.
problemDetail.title.org.springframework.web.method.annotation.MethodArgumentTypeMismatchException=Parâmetro inválido
