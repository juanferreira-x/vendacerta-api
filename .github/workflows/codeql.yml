# Varredura de segurança do código (CodeQL), gratuita em repositórios públicos.
# Procura padrões vulneráveis (ex: injeção de SQL) e mostra os alertas na aba "Security" do GitHub.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: none

      - uses: github/codeql-action/analyze@v4
