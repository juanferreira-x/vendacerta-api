# Integração contínua: a cada push na main e a cada pull request, o GitHub compila,
# roda TODOS os testes (inclusive o de PostgreSQL com Testcontainers) e confere a formatação.
# Se algo falhar, o PR fica marcado em vermelho.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build, testes, cobertura e formatação
        run: ./mvnw -B verify

      - name: Publica o relatório de cobertura (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/
