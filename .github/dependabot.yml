# Dependabot: uma vez por semana, abre pull requests atualizando dependências desatualizadas
# (Maven, GitHub Actions e imagens Docker). O CI testa cada PR antes de você decidir o merge.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
